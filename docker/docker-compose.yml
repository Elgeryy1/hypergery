services:
  hypergery-hub:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: hypergery-hub
    ports:
      - "${HYPERGERY_HUB_PORT:-8765}:8765"
    volumes:
      - hypergery-hub-data:/data
      - ${HYPERGERY_NAS_ROOT:-/share/CACHEDEV2_DATA/Gerard/hypergery}:/hypergery
    environment:
      - HYPERGERY_HUB_DB=/data/hypergery-hub.sqlite
      - HYPERGERY_HUB_STAGING=/hypergery/staging
      - HYPERGERY_NAS_ROOT=/hypergery
      - HYPERGERY_HUB_HOST=0.0.0.0
      - HYPERGERY_HUB_PORT=8765
      # v1.2: auth obligatoria. Si no se define, el Hub genera y persiste un
      # token en /data/hub_token (léelo con: docker exec hypergery-hub cat /data/hub_token).
      - HYPERGERY_HUB_TOKEN=${HYPERGERY_HUB_TOKEN:-}
    restart: unless-stopped

volumes:
  hypergery-hub-data:
