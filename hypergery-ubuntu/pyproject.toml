[project]
name = "hypergery-ubuntu"
version = "1.0.1"
description = "HyperGery desktop VM manager for Ubuntu KVM/QEMU/libvirt"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.6",
]

[project.scripts]
hypergery = "hypergery_ubuntu.app:main"
hypergery-cli = "hypergery_ubuntu.cli:main"
hypergery-agent = "hypergery_ubuntu.agent:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hypergery_ubuntu*"]
