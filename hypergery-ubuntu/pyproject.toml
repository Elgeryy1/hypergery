[project]
name = "hypergery-ubuntu"
dynamic = ["version"]
description = "HyperGery desktop VM manager for Ubuntu KVM/QEMU/libvirt"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.6",
]

[project.scripts]
hypergery = "hypergery_ubuntu.app:main"
hypergery-cli = "hypergery_ubuntu.cli:main"
hypergery-agent = "hypergery_ubuntu.agent:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hypergery_ubuntu*"]

[tool.setuptools.package-data]
hypergery_ubuntu = ["ui_qt/assets/*.png"]

[tool.setuptools.dynamic]
version = {attr = "hypergery_ubuntu.__version__"}

[tool.pytest.ini_options]
markers = [
  "needsRealLibvirt: smoke tests against the real libvirt/QEMU host (only hgtest-* VMs; run with HYPERGERY_REAL_LIBVIRT=1)",
]
